# Log paths only: query strings can contain media capabilities/reset tokens.
log_format safe_access '$remote_addr - $request_method $uri $status $body_bytes_sent';
access_log /var/log/nginx/access.log safe_access;
# 用户端静态站：同源反代 /api、/static、易支付 notify
server {
    listen 80;
    server_name _;
    client_max_body_size 512m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location = /epay/notify {
        proxy_pass http://api:8000/api/billing/epay/notify;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Refuse dotfiles and development/backup artifacts before SPA fallback.
    location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location ~* (?:^|/)(?:Dockerfile|docker-compose[^/]*|package(?:-lock)?\.json|requirements[^/]*\.txt|[^/]+\.(?:sql|sqlite3?|bak|old|orig|pem|key))$ { return 404; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
