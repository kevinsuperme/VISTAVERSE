# 独立中间件：仅 Postgres + Redis（与 /opt/kepu 无关）
# 默认端口避开 kepu 的 5432/6379
# 启动: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.prod up -d
# PG/Redis 仅绑定宿主机回环地址，避免把数据库服务暴露到公网。
name: ai-movie-infra

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: ai-movie-pg
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printfilm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-printfilm}
    volumes:
      - ai_movie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printfilm} -d ${POSTGRES_DB:-printfilm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    container_name: ai-movie-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env.prod}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ai_movie_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ai_movie_pgdata:
  ai_movie_redisdata:
