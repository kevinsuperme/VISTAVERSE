# PRINTFILM 全栈（GitHub / 自托管）：拉取公开 ACR 镜像，无需本地构建
# gcc 命名空间公开，docker pull 不用登录
# 启动：cp deploy/.env.docker.example deploy/.env.docker
#       Generate and verify deploy/release.lock.yml using deploy/scripts/check_release.py first.
#       docker compose --env-file deploy/.env.docker -f docker-compose.yml -f deploy/release.lock.yml up -d --no-build
name: printfilm

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printfilm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-printfilm}
    volumes:
      - printfilm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printfilm} -d ${POSTGRES_DB:-printfilm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env.docker}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - printfilm_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: gcc-registry.cn-hangzhou.cr.aliyuncs.com/gcc/printfilm-api:${PRINTFILM_VERSION:?set PRINTFILM_VERSION to a unique release tag}
    restart: unless-stopped
    env_file:
      - deploy/.env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-printfilm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-printfilm}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-printfilm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-printfilm}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - printfilm_media:/app/static/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    image: gcc-registry.cn-hangzhou.cr.aliyuncs.com/gcc/printfilm-web:${PRINTFILM_VERSION:?set PRINTFILM_VERSION to a unique release tag}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  admin-web:
    image: gcc-registry.cn-hangzhou.cr.aliyuncs.com/gcc/printfilm-admin-web:${PRINTFILM_VERSION:?set PRINTFILM_VERSION to a unique release tag}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:80"

volumes:
  printfilm_pgdata:
  printfilm_redisdata:
  printfilm_media:
