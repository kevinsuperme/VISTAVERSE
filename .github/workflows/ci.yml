name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: printfilm
          POSTGRES_PASSWORD: printfilm-ci-password
          POSTGRES_DB: printfilm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U printfilm -d printfilm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - name: Compile backend
        run: python -m compileall -q app tests
        working-directory: backend
      - name: Run backend tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=35
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://printfilm:printfilm-ci-password@127.0.0.1:5432/printfilm
          DATABASE_URL_SYNC: postgresql+psycopg2://printfilm:printfilm-ci-password@127.0.0.1:5432/printfilm
          SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
          ENVIRONMENT: test
          ARK_MOCK: "true"
          TASK_RUNTIME_ENABLED: "false"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm test
        working-directory: admin
      - run: npm run lint
        working-directory: admin
      - run: npm run build
        working-directory: admin
